name: Deploy the app to GitHub Pages

# Publishes the installable app (service worker, web manifest, offline start) with demo data at
# this repository's Pages address, https://<owner>.github.io/<repo>/. Open it on a phone and
# install it: Add to Home Screen on iPhone, Install app on Android.
on:
  push:
    branches: [main, claude/new-session-pjhs5b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build the app for this Pages address
        run: npm run build:pages
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_APP_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
