name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Re-record the visual regression baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:fast
      - name: Asset budgets
        run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end and accessibility
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse, mobile
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Performance, accessibility, SEO and best-practice budgets
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  visual:
    name: Visual regression
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pixels only compare within one rendering environment: always this image.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare with baselines
        if: ${{ !inputs.update_baselines && hashFiles('e2e/visual.spec.ts-snapshots/**') != '' }}
        run: npm run test:visual
      - name: No baselines yet
        if: ${{ !inputs.update_baselines && hashFiles('e2e/visual.spec.ts-snapshots/**') == '' }}
        run: echo "::notice::No visual baselines committed. Run this workflow with update_baselines to record them."
      - name: Record baselines
        if: ${{ inputs.update_baselines }}
        run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_baselines }}
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7
