name: Render Self
# run 1 — screenshot the built index.html

on:
  push:
    paths:
      - 'index.html'
      - 'render-self.mjs'
      - '.github/workflows/render-self.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.44.1-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Render (logged)
        shell: bash
        run: |
          mkdir -p preview
          {
            set -x
            node -v
            npm init -y
            npm i playwright@1.44.1
            node render-self.mjs
          } > preview/render.log 2>&1 || echo "BLOCK_FAILED rc=$?" >> preview/render.log
          echo "----- render.log tail -----"
          tail -30 preview/render.log

      - name: Commit screenshots
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview
          git commit -m "Render preview screenshots [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
