<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plimsoll · The price is sea level</title>
    <meta
      name="description"
      content="Plimsoll charts what a company is worth under every story you could tell about it, and draws the coastline the market is already betting on. Company analysis and valuation for Apple, NVIDIA, Coca-Cola, Tesla and more, or any company you survey yourself."
    />
    <meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071219" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plimsoll" />
    <meta property="og:title" content="Plimsoll · The price is sea level" />
    <meta
      property="og:description"
      content="See what the market believes about a company, and what you have to believe. Valuation drawn as a nautical chart."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/src/assets/fonts/newsreader-display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/newsreader-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply a stored theme before first paint so the page never flashes.
      try {
        var t = JSON.parse(localStorage.getItem('plimsoll:theme') || 'null');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Plimsoll",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "description": "Company analysis and valuation drawn as a nautical chart: value terrain, the market-implied coastline, and Monte Carlo odds.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font: 16px/1.5 Georgia, serif; padding: 2rem; max-width: 40rem">
        Plimsoll draws its charts in your browser and needs JavaScript. Every model is explained on the method page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
